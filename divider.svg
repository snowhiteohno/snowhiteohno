      <stop offset="0.16" stop-color="#D07BA6" stop-opacity="0.9"/>
      <stop offset="0.84" stop-color="#D07BA6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D07BA6" stop-opacity="0"/>
    </linearGradient>
    <path id="dpetal" d="M0,0 C6,-3 9,-10 6,-16 C3,-20 -3,-20 -6,-16 C-9,-10 -6,-3 0,0 Z"/>
